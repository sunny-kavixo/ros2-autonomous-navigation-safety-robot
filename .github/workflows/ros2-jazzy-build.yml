name: ros2-jazzy-build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep ros-jazzy-xacro
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select safety_supervisor robot_description --event-handlers console_direct+
          colcon test-result --verbose
      - name: Validate Xacro
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          xacro src/robot_description/urdf/mobile_robot.urdf.xacro > /tmp/mobile_robot.urdf
          test -s /tmp/mobile_robot.urdf
